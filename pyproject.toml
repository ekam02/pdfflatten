[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfflatten"
version = "0.1.0"
description = "PDF to PNG and PNG to PDF conversion tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyMuPDF",
    "Wand",
    "pillow",
    "MagickWand",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
